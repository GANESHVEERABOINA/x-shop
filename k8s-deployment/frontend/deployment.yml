apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: ganeshveeraboina/x-shop-three-tire-app:frontend
          ports:
            - containerPort: 80
          env: 
          - name: REACT_APP_BACKEND_URL
            # CHANGED: Localhost/Minikube IP updated to Public Ingress standard routing path URL
            value: "http://16.112.180.201/api/"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"