upstream xshop_backend {
    server backend:4000;
    keepalive 32;
}

upstream xshop_frontend {
    server frontend:80;
    keepalive 16;
}

upstream xshop_admin {
    server admin:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend API: preserve the /api prefix for Express routes.
    location = /api {
        proxy_pass http://xshop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        proxy_pass http://xshop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The admin bundle is built with /admin/ as its asset base. Strip that
    # prefix only when proxying to the admin static-file container.
    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        proxy_pass http://xshop_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Customer storefront and React SPA fallback.
    location / {
        proxy_pass http://xshop_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
